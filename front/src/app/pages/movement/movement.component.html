<app-page
    [title]="title"
    [labelButtonAdd]="labelButtonAdd"
    [data]="dataList"
    [cols]="columns"
    [buttonConfig]="buttonConfig"
    [isLoading]="isLoading"
    [hasError]="hasError"
    [isEmpty]="isEmpty"
    (onCreate)="openForm()"
    [hideCreateButton]="!canCreate"
/>
<app-movement-form
    #form
    [data]="dataObject"
    (onSave)="save($event)"
    (onUpdate)="update($event)"
    [consortiumList]="consortiumList"
    [supplierList]="supplierList"
    [conceptList]="conceptList"
    [functionalUnitList]="functionalUnitList"
    [isReady]="!isLoadingEntities()"
    [hasError]="hasErrorEntities()"
/>
