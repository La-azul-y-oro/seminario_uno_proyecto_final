<app-page
    [title]="title"
    [labelButtonAdd]="labelButtonAdd"
    [data]="dataList"
    [cols]="columns"
    [buttonConfig]="buttonConfig"
    [isLoading]="isLoading"
    [hasError]="hasError"
    [isEmpty]="isEmpty"
    (onCreate)="openForm()"
    [expandable]="true"
    [expandData]="expandData"
/>
<app-toast #toast />
<app-confirm-dialog 
    #dialog
    (onConfirm)="deleteItem($event)"
    />
<app-consortium-form 
    #form
    [data]="dataObject"
    (onSave)="save($event)"
    (onUpdate)="update($event)"
    />
<app-liquidation-dialog 
    [visible]="showLiquidationDialog"
    (onCancel)="showLiquidationDialog = false"
    (onConfirm)="generateLiquidation($event)"
/>
<app-report-dialog 
    [visible]="showReportDialog"
    [consortiumId]="consortiumId!"
    (onCancel)="showReportDialog = false"
    (onExpenses)="getExpensesReport($event)"
    (onFinancialReport)="getFinancialReport($event)"
/>
<app-functional-unit-dialog
    [visible]="showFunctionalUnitDialog"
    [consortiumId]="consortiumId!"
    (onCancel)="resetUnitFunctionalData()"
    (onSave)="saveFunctionalUnits($event)"
/>
