<app-page
    [title]="title"
    [labelButtonAdd]="labelButtonAdd"
    [data]="dataList"
    [cols]="columns"
    [buttonConfig]="buttonConfig"
    [isLoading]="isLoading"
    [hasError]="hasError"
    [isEmpty]="isEmpty"
    (onCreate)="openForm()"
    [hideCreateButton]="!canCreate"
/>

<app-user-form 
    #form
    [data]="dataObject"
    (onSave)="save($event)"
    (onUpdate)="update($event)"
    />
