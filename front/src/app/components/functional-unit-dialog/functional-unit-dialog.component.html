<p-dialog
  header="Unidades Funcionales"
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '800px', height: '650px' }"
  (onHide)="closeDialog()"
>

<div class="row justify-content-center align-items-center h-100" *ngIf="isLoading || hasError">
    <!-- Loader -->
  <div class="col text-center" *ngIf="isLoading">
    <p-progressSpinner styleClass="custom-spinner"></p-progressSpinner>
  </div>

  <!-- Mensaje de error -->
  <div class="col alert alert-danger text-center" *ngIf="hasError">
    <p><i class="pi pi-exclamation-triangle"></i> Ocurrió un error al cargar los datos. Por favor recarge la página.</p>
  </div>
</div>


  <form *ngIf="!isLoading && !hasError" [formGroup]="form">
    <div style="max-height: 650px; overflow-y: auto; padding: 0 1rem">
      <p-table
        [value]="units.controls"
        scrollable="true"
        scrollHeight="450px"
        [tableStyle]="{ 'min-width': '600px'}"
      >
        <ng-template pTemplate="header">
          <tr>
            <th>Nombre</th>
            <th>Factor (%)</th>
            <th>Balance</th>
            <th>Acciones</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-unit let-rowIndex="rowIndex">
          <tr [formGroup]="unit">
            <td>
              <input
                pInputText
                formControlName="name"
                placeholder="Nombre"
                style="padding: 0.5rem"
              />
            </td>
            <td>
              <input
                pInputText
                type="number"
                formControlName="factor"
                placeholder="Factor"
                (input)="onFactorChange()"
                min="0"
                max="100"
                style="padding: 0.5rem"
              />
            </td>
            <td>
              {{ unit.get("balance")?.value | currency : "$" }}
            </td>
            <td>
              <p-button
                icon="pi pi-trash"
                severity="danger"
                [pTooltip]="showTooltipCannotDelete(unit)"
                (click)="canDelete(unit) ? removeUnit(rowIndex) : null"
                [ngClass]="{ disabled: !canDelete(unit) }"
                onkeypress
              />
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="footer">
          <tr>
            <td><strong>Total</strong></td>
            <td>{{ totalFactor.toFixed(2) }} %</td>
            <td colspan="2"></td>
          </tr>
        </ng-template>
      </p-table>
    </div>

    <div *ngIf="totalFactor !== 100 && units.controls.length > 0">
      <p-messages
        [value]="[
          {
            severity: 'warn',
            detail: 'La suma debe ser exactamente 100%'
          }
        ]"
        [closable]="false"
      />
    </div>

    <div class="d-flex justify-content-between align-items-center mt-4">
      <div>
        <p-button
          label="Agregar Unidad"
          icon="pi pi-plus"
          (click)="addUnit()"
          severity="info"
          styleClass="p-button-sm"
          onKeyPress
        />
      </div>

      <div class="d-flex gap-2">
        <p-button
          label="Cancelar"
          (click)="closeDialog()"
          severity="secondary"
          styleClass="p-button-sm"
          onKeyPress
        />
        <p-button
          label="Guardar"
          icon="pi pi-save"
          [disabled]="!canSave()"
          (click)="save()"
          styleClass="p-button-sm"
          onKeyPress
        />
      </div>
    </div>
  </form>
</p-dialog>
<app-toast #toast />
