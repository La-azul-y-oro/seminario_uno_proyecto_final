<p-dialog
  header="Generar liquidación"
  [(visible)]="visible"
  [style]="{ width: '600px', height: '475px' }"
  [closable]="false"
>
  <!-- Input oculto para atrapar el foco -->
  <input type="text" class="d-none" />
  
  <!-- Loading state -->
  <div *ngIf="isLoadingExpensas" class="text-center mt-5 justify-content-center align-items-center">
    <p-progressSpinner styleClass="w-4rem h-4rem" strokeWidth="3" fill="var(--surface-ground)" animationDuration=".5s"></p-progressSpinner>
    <p class="mt-2 text-muted">Recuperando liquidaciones...</p>
  </div>
  
  <!-- Error state -->
  <div class="col alert alert-danger text-center mt-3" *ngIf="!isLoadingExpensas && hasErrorExpensas">
    <p><i class="pi pi-exclamation-triangle"></i> Ocurrió un error al cargar los datos. Por favor recarge la página.</p>
  </div>
  
  <!-- Content state -->
  <div *ngIf="!isLoadingExpensas && !hasErrorExpensas">
    <div
      class="d-flex flex-wrap align-items-center justify-content-center text-center"
    >
      <div class="col-6">
        <p class="mb-3">Período a liquidar</p>
        <p-calendar
          [(ngModel)]="date"
          view="month"
          dateFormat="mm/yy"
          [readonlyInput]="true"
          [maxDate]="maxDate"
        />
      </div>
      <div class="col-6">
        <p class="mb-3">Fecha vencimiento</p>
        <p-calendar
          [(ngModel)]="expirationDate"
          [readonlyInput]="true"
          [minDate]="minDateExpiration"
          [touchUI]="true" 
        />
      </div>
      <div *ngIf="!isValidPeriod()">
        <p [ngStyle]="{color: '#b32b23'}">El periodo seleccionado ya fue liquidado.</p>
      </div>
    </div>
    <p-divider />
    <div class="mt-3 px-3">
      <p>Últimas liquidaciones generadas:</p>
      <div *ngIf="expensasList.length > 0; else noExpensas">
        <div
          *ngFor="let item of expensasList"
          class="d-flex align-items-center mb-2"
        >
          <label>{{ item.period }}</label>
        </div>
      </div>
      <ng-template #noExpensas>
        <p class="text-muted text-center mt-2">
          No hay liquidaciones generadas.
        </p>
      </ng-template>
    </div>
  </div>
  
  <ng-template pTemplate="footer">
    <div class="d-flex justify-content-end gap-2">
      <p-button label="Cancelar" severity="secondary" (click)="onClose()" />
      <p-button [disabled]="!canSend()" label="Generar" (click)="onSave()" />
    </div>
  </ng-template>
</p-dialog>
