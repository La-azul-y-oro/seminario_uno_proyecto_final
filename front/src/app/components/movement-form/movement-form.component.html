<app-form 
    #form
    [titleOnCreate]="'Crear movimiento'"
    [titleOnUpdate]="'Actualizar movimiento'"
    [fields]="fields"
    (onSave)="saveData($event)"
    (onUpdate)="updateData($event)"
    [data]="data"
    [textError]="'No se han encontrado datos asociados para utilizar'"
    [isReady]="isReady"    
    [hasReadyError]="hasError"
/>
