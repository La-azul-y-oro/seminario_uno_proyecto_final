<p-dialog
  header="{{ title }}"
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '65vw' }"
  focusOnShow="false"
  (onHide)="resetAll()"
>
  <div *ngIf="!isReady" class="text-center p-5">
    <p-progressSpinner
      [style]="{ width: '50px', height: '50px' }"
      strokeWidth="4"
    >
    </p-progressSpinner>
    <p>Iniciando formulario...</p>
  </div>

  <div *ngIf="hasReadyError" class="text-center p-5">
    <i
      class="pi pi-exclamation-triangle text-warning"
      style="font-size: 3rem"
    ></i>
    <h4 class="mt-3">Error</h4>
    <p>No se han encontrado datos asociados para utilizar</p>
  </div>

  <div *ngIf="isReady && !hasReadyError">
    <form [formGroup]="form">
      <div class="row pt-5 mb-5">
        <div [ngClass]="'col-12 col-md-6 gap-1 margin-bottom'">
          <p-floatLabel>
            <p-dropdown
              [options]="consortiumList"
              [showClear]="true"
              [formControlName]="'consortiumId'"
              [style]="{ width: '100%' }"
              appendTo="body"
              optionLabel="name"
              optionValue="id"
            >
            </p-dropdown>

            <label [for]="'consortiumId'"> Consorcio* </label>
          </p-floatLabel>

          <small *ngIf="hasError('consortiumId')" class="input-invalid">
            El dato es obligatorio
          </small>
        </div>
        <div [ngClass]="'col-12 col-md-6 gap-1 margin-bottom'">
          <p-floatLabel>
            <p-dropdown
              [options]="movementTypeList"
              [showClear]="true"
              [formControlName]="'type'"
              [style]="{ width: '100%' }"
              appendTo="body"
              optionLabel="name"
              optionValue="id"
            >
            </p-dropdown>

            <label [for]="'type'"> Tipo de movimiento* </label>
          </p-floatLabel>

          <small *ngIf="hasError('type')" class="input-invalid">
            El dato es obligatorio
          </small>
        </div>
      </div> 

      <div *ngIf="isFirstStepCompleted()" class="row">
        <div *ngIf="isEgreso()" [ngClass]="'col-12 col-md-6 gap-1 mb-5'">
          <p-floatLabel>
            <p-dropdown
              [options]="supplierList"
              [showClear]="true"
              [formControlName]="'supplierId'"
              [style]="{ width: '100%' }"
              appendTo="body"
              optionLabel="name"
              optionValue="id"
            >
            </p-dropdown>

            <label [for]="'supplierId'"> Proveedor* </label>
          </p-floatLabel>

          <small *ngIf="hasError('supplierId')" class="input-invalid">
            El dato es obligatorio
          </small>
        </div>

        <div *ngIf="!isEgreso()" [ngClass]="'col-12 col-md-6 gap-1 mb-5'">
          <p-floatLabel>
            <p-dropdown
              [options]="getFunctionalUnits()"
              [showClear]="true"
              [formControlName]="'functionalUnitId'"
              [style]="{ width: '100%' }"
              appendTo="body"
              optionLabel="name"
              optionValue="id"
            >
            </p-dropdown>

            <label [for]="'functionalUnitId'"> Unidad Funcional* </label>
          </p-floatLabel>

          <small *ngIf="hasError('functionalUnitId')" class="input-invalid">
            El dato es obligatorio
          </small>
        </div>

        <div [ngClass]="'col-12 col-md-6 gap-1 mb-5'">
          <p-floatLabel>
            <p-dropdown
              [options]="getConcepts()"
              [showClear]="true"
              [formControlName]="'conceptId'"
              [style]="{ width: '100%' }"
              appendTo="body"
              optionLabel="name"
              optionValue="id"
            >
            </p-dropdown>

            <label [for]="'conceptId'"> Concepto* </label>
          </p-floatLabel>

          <small *ngIf="hasError('conceptId')" class="input-invalid">
            El dato es obligatorio
          </small>
        </div>

        <div [ngClass]="'col-12 col-md-6 col-lg-4 gap-1 mb-5'">
          <p-floatLabel>
            <p-calendar
              [formControlName]="'date'"
              [showIcon]="true"
              [placeholder]="'Ingrese la fecha'"
              [dateFormat]="'dd/mm/yy'"
              [showButtonBar]="true"
              [style]="{ width: '100%' }"
              appendTo="body"
              [maxDate]="maxDate"
            >
            </p-calendar>

            <label [for]="'date'"> Fecha* </label>
          </p-floatLabel>

          <small *ngIf="hasError('date')" class="input-invalid">
            El dato es obligatorio
          </small>
        </div>

        <div [ngClass]="'col-12 col-md-6 col-lg-4 gap-1 mb-5'">
          <p-floatLabel>
            <p-inputNumber
              [id]="'amount'"
              [formControlName]="'amount'"
              [useGrouping]="false"
              [min]="0"
              [placeholder]="'Ingrese el monto'"
              [style]="{ width: '100%' }"
              mode="decimal"
              [minFractionDigits]="2"
              [maxFractionDigits]="2"
              prefix="$ "
            />

            <label [for]="'amount'"> Monto* </label>
          </p-floatLabel>

          <small *ngIf="hasError('amount')" class="input-invalid">
            El dato es obligatorio
          </small>
        </div>

        <div [ngClass]="'col-12 col-lg-4 gap-1 mb-5'">
          <p-floatLabel>
            <input
            pInputText
            [id]="'receipt'"
            [formControlName]="'receipt'"
            [type]="'text'"
            [placeholder]="'Ingrese el recibo'"/>

            <label [for]="'receipt'"> Recibo </label>
          </p-floatLabel>
        </div>
        
        <div [ngClass]="'col-12 gap-1 mb-5'">
          <p-floatLabel>
            <input
            pInputText
            [id]="'comment'"
            [formControlName]="'comment'"
            [type]="'text'"
            [placeholder]="'Ingrese la descripción'"/>

            <label [for]="'comment'"> Descripción* </label>
          </p-floatLabel>
          <small *ngIf="hasError('comment')" class="input-invalid">
            El dato es obligatorio
          </small>
        </div>
      </div>

      <div class="text-end pt-2">
        <p-button
          class="me-3"
          label="Cancelar"
          severity="secondary"
          (onClick)="visible = false"
        />
        <p-button
          type="submit"
          label="Guardar"
          (onClick)="confirm()"
          [disabled]="!canSend()"
        />
      </div>
    </form>
  </div>
</p-dialog>
