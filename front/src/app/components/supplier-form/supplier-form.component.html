<app-form 
    #form
    [titleOnCreate]="'Crear proveedor'"
    [titleOnUpdate]="'Actualizar proveedor'"
    [fields]="fields"
    (onSave)="saveData($event)"
    (onUpdate)="updateData($event)"
    [data]="data"

    [isReady]="isReady"
    [hasReadyError]="hasError"
/>
