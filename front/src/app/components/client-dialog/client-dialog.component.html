<p-dialog
  [header]="getHeader()"
  [(visible)]="visible"
  [style]="{ minWidth: '700px', minHeight: '400px' }"
  (onHide)="closeDialog()"
>
  <div class="w-100">
    <p-table
      [value]="selectedClients"
      [tableStyle]="{ 'min-width': '100%' }"
      styleClass="p-datatable-sm"
    >
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 50%">Cliente <span class="text-danger">*</span></th>
          <th style="width: 35%">Tipo <span class="text-danger">*</span></th>
          <th style="width: 15%">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-item let-rowIndex="rowIndex">
        <tr>
          <td>
            <p-dropdown
              [(ngModel)]="item.client"
              [options]="getAvailableClientsForItem(item)"
              optionLabel="fullName"
              placeholder="Seleccionar cliente"
              [style]="{ width: '100%' }"
              [filter]="true"
              appendTo="body"
              filterBy="firstName,lastName,email"
              [styleClass]="!item.client ? 'ng-invalid ng-dirty' : ''"
              dataKey="id"
            >
              <ng-template let-client pTemplate="item">
                {{ client.firstName }} {{ client.lastName }} ({{
                  client.email
                }})
              </ng-template>
              <ng-template let-client pTemplate="selectedItem">
                {{ client.firstName }} {{ client.lastName }}
              </ng-template>
            </p-dropdown>
          </td>
          <td>
            <p-dropdown
              [(ngModel)]="item.type"
              [options]="clientTypes"
              optionLabel="label"
              optionValue="value"
              placeholder="Seleccionar tipo"
              appendTo="body"
              [style]="{ width: '100%' }"
              [styleClass]="!item.type ? 'ng-invalid ng-dirty' : ''"
            />
          </td>
          <td class="text-center">
            <p-button
              icon="pi pi-trash"
              severity="danger"
              [text]="true"
              (onClick)="removeClient(rowIndex)"
            />
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="3" class="text-center">No hay clientes vinculados.</td>
        </tr>
      </ng-template>
    </p-table>

    <div class="d-flex justify-content-between align-items-center mt-4">
      <div class="d-flex flex-column">
        <p-button
          label="Agregar Cliente"
          icon="pi pi-plus"
          size="small"
          severity="info"
          (onClick)="addNewClient()"
          [disabled]="!canAddMoreClients()"
        />
        <small
          class="mt-1 ms-2 text-muted"
          *ngIf="!canAddMoreClients()"
        >
          No hay más clientes disponibles
        </small>
      </div>

      <div class="d-flex gap-2">
        <p-button
          label="Cerrar"
          severity="secondary"
          size="small"
          class="me-2"
          (onClick)="closeDialog()"
        />
        <p-button
          label="Guardar"
          icon="pi pi-check"
          size="small"
          (onClick)="confirmClients()"
          [disabled]="!canSave"
        />
      </div>
    </div>
  </div>
</p-dialog>
