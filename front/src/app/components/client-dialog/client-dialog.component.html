<p-dialog
  [header]="getHeader()"
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '800px', height: '650px' }"
  (onHide)="closeDialog()"
  [appendTo]="'body'"
>
  <div class="row mb-3">
    <div class="text-end">
      <p-button
        (onClick)="openAddClientModal()"
        label="Agregar clientes"
        icon="pi pi-plus"
        size="small"
      />
    </div>
  </div>

  <div
    class="row mb-3"
    style="max-height: 650px; overflow-y: auto; padding: 0 1rem"
  >
    <p-table
      [value]="bindClients"
      scrollable="true"
      scrollHeight="450px"
      [tableStyle]="{ 'min-width': '400px' }"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Email</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-client>
        <tr>
          <td>{{ client.firstName }}</td>
          <td>{{ client.lastName }}</td>
          <td>{{ client.email }}</td>
          <td>
            <i
              (click)="removeClient(client)"
              class="pi pi-times-circle"
              [pTooltip]="'Remover Usuario'"
              style="color: #dc3545"
              onKeyPress=""
            >
            </i>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" class="text-center">
            No existen clientes asociados.
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <div class="row mb-3">
    <div class="text-end">
      <p-button
        label="Cerrar"
        size="small"
        severity="secondary"
        (onClick)="closeDialog()"
      />
    </div>
  </div>
</p-dialog>

<!-- MODAL para seleccionar nuevos clientes -->
<p-dialog
  header="Seleccionar clientes"
  [(visible)]="addClientModalVisible"
  [style]="{ minWidth: '400px' }"
  (onHide)="cancelAddClient()"
>
  <div class="w-100">
    <div class="mb-3">
      <p-multiSelect
        #multiSelectRef
        inputId="clientMultiSelect"
        [options]="availableClients"
        optionLabel="fullName"
        optionValue="id"
        placeholder="Seleccionar clientes"
        appendTo="body"
        [style]="{ width: '100%' }"
        (onChange)="addClient($event)"
        emptyMessage="No hay clientes disponibles"
        emptyFilterMessage="Sin resultados"
        selectedItemsLabel="{0} Clientes seleccionados"
        [maxSelectedLabels]=2
      >
        <ng-template let-client pTemplate="item">
          {{ client.firstName }} {{ client.lastName }} ({{ client.email }})
        </ng-template>
      </p-multiSelect>
    </div>

    <div class="row">
      <div class="col">
        <p-button
          label="Cancelar"
          severity="secondary"
          size="small"
          class="me-2"
          (onClick)="cancelAddClient()"
          [classList]="'me-3'"
        />

        <p-button
          label="Guardar"
          icon="pi pi-check"
          size="small"
          (onClick)="confirmAddClients()"
          [disabled]="!idClientsToAdd.length"
        />
      </div>
    </div>
  </div>
</p-dialog>
